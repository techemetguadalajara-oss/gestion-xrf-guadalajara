<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión XRF Centralizado</title>
<style>
:root {
  --primary-color: #0066cc;
  --primary-light: #e6f2ff;
  --primary-dark: #004080;
  --secondary-color: #f8f9fa;
  --border-color: #d1e0f0;
  --text-color: #333333;
  --text-light: #666666;
  --success-color: #28a745;
  --warning-color: #ffcc00;
  --danger-color: #dc3545;
  --radius: 12px;
  --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: var(--text-color); margin: 0; padding: 20px; }
.container { max-width: 1200px; margin: auto; }

h1 { color: var(--primary-dark); font-size: 28px; margin-bottom: 25px; text-align: center; font-weight: 600; }
h2 { color: var(--primary-dark); font-size: 20px; margin-bottom: 15px; border-bottom: 2px solid var(--primary-light); padding-bottom: 8px; }

.header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.btn-refrescar { background-color: #17a2b8; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn-refrescar:hover { background-color: #138496; }
.btn-danger { background-color: var(--danger-color); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn-danger:hover { background-color: #bd2130; }
.btn-secundario { background-color: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-secundario:hover { background-color: #5a6268; }

.role-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
.role-btn { padding: 10px 20px; border: 2px solid var(--primary-color); background: white; color: var(--primary-color); font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.role-btn.active { background: var(--primary-color); color: white; }

form, .vista-panel { background: white; padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 30px; border: 1px solid var(--border-color); }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-color); }
input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background-color: var(--secondary-color); transition: border-color 0.2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); }

.checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 13px; color: var(--text-light); }
.checkbox-container input { width: auto; }

button[type="submit"] { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; padding: 12px; border-radius: 8px; width: 100%; transition: background-color 0.2s; }
button[type="submit"]:hover { background-color: var(--primary-dark); }

.btn-accion-xrf { background-color: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: background 0.2s; white-space: nowrap; height: 38px; }
.btn-accion-xrf:hover { background-color: var(--primary-dark); }

/* TABLERO KANBAN DE COLUMNAS PLEGABLES */
.tablero-columnas { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; align-items: start; }
.columna { background: #eef4fb; padding: 15px; border-radius: var(--radius); border: 1px solid var(--border-color); transition: all 0.3s ease; }
.columna-titulo { font-size: 15px; font-weight: 700; color: var(--primary-dark); margin-bottom: 12px; text-align: center; display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; user-select: none; }
.columna-titulo:hover { background-color: var(--primary-light); }
.columna-contador { background: var(--primary-color); color: white; border-radius: 12px; padding: 2px 8px; font-size: 12px; margin-left: 8px; }
.columna-contenido { display: block; }
.columna.plegada .columna-contenido { display: none; }
.columna.plegada { min-height: auto; padding-bottom: 10px; }

.toggle-icono { font-size: 12px; color: var(--primary-color); transition: transform 0.2s; }

.muestra-item { background: white; padding: 15px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.muestra-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }

/* Código de Colores de Estatus */
.muestra-item.estado-esperando::before { background-color: #6c757d; }
.muestra-item.estado-limpieza::before { background-color: #17a2b8; }
.muestra-item.estado-trituracion::before { background-color: #ff9900; }
.muestra-item.estado-analizando::before { background-color: #0066cc; }
.muestra-item.estado-terminado::before { background-color: #28a745; }
.muestra-item.estado-humedad::before { background-color: #6f42c1; }
.muestra-item.estado-faltapeso::before { background-color: #dc3545; }

.card-header { display: flex; justify-content: space-between; align-items: center; }
.codigo { font-family: monospace; font-size: 13px; font-weight: 600; color: var(--primary-color); background-color: var(--primary-light); padding: 3px 6px; border-radius: 6px; }
.fecha { font-size: 11px; color: var(--text-light); }
.card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; color: var(--text-light); }
.card-body strong { color: var(--text-color); }
.card-footer-row { display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 5px; }
.card-footer-row > div { flex-grow: 1; }
.badge-corregido { background-color: #ffc107; color: #333; font-size: 9px; padding: 1px 4px; border-radius: 4px; font-weight: bold; margin-left: 3px; }
.loading { text-align: center; color: var(--primary-color); font-weight: 600; padding: 20px; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="container">
  <h1>Sistema de Gestión XRF Centralizado</h1>

  <div class="header-bar">
    <div class="role-selector" style="margin-bottom:0;">
      <button class="role-btn active" id="btn-compras" onclick="cambiarRol('compras')">Vista: Agente de Compras</button>
      <button class="role-btn" id="btn-xrf" onclick="solicitarAccesoXRF()">Vista: Analista XRF 🔒</button>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-secundario" onclick="plegarTodasColumnas(true)">📂 Plegar Todo</button>
      <button class="btn-secundario" onclick="plegarTodasColumnas(false)">📂 Abrir Todo</button>
      <button class="btn-refrescar" onclick="cargarMuestrasDesdeNube()">🔄 Sincronizar</button>
      <button class="btn-danger" id="btn-borrar-todo" style="display:none;" onclick="confirmarBorrarTodo()">⚠️ Borrar Todo</button>
    </div>
  </div>

  <!-- SECCIÓN COMPRAS -->
  <div id="seccion-compras">
    <h2>Registrar Nueva Muestra</h2>
    <form id="form-compras">
      <div class="form-group">
        <label for="proveedor">Proveedor:</label>
        <input type="text" id="proveedor" list="lista-proveedores" placeholder="Escribe o selecciona proveedor..." required>
        <datalist id="lista-proveedores"></datalist>
      </div>

      <div class="form-group">
        <label for="agente">Agente de Compras:</label>
        <input type="text" id="agente" list="lista-agentes" placeholder="Escribe tu primer nombre y primer apellido" required>
        <datalist id="lista-agentes"></datalist>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de Cerámica:</label>
        <input type="text" id="tipo" list="lista-tipos" placeholder="Ej. Gasolina, Diesel, etc." required>
        <datalist id="lista-tipos"></datalist>
      </div>

      <div class="form-group">
        <label for="fecha-recolectada">Fecha Recolectada (Día de compra/recolección):</label>
        <input type="date" id="fecha-recolectada" required>
      </div>

      <div class="form-group">
        <label for="fecha-ingreso">Fecha de Ingreso a Bodega:</label>
        <input type="date" id="fecha-ingreso" disabled>
        <div class="checkbox-container">
          <input type="checkbox" id="activar-ingreso" onchange="toggleIngresoBodega(this)">
          <label for="activar-ingreso" style="margin-bottom:0; display:inline; font-weight:normal;">Ingresar a bodega hoy (El material llegó a bodega)</label>
        </div>
      </div>

      <div class="form-group">
        <label for="peso-inicial">Peso Inicial (kg):</label>
        <input type="number" step="0.01" id="peso-inicial" placeholder="Ej. 12.5">
        <div class="checkbox-container">
          <input type="checkbox" id="sin-peso" onchange="togglePesoInicial(this)">
          <label for="sin-peso" style="margin-bottom:0; display:inline; font-weight:normal;">No se pudo pesar / Ingresar después al llegar a bodega</label>
        </div>
      </div>

      <div class="form-group">
        <label for="tipo-analisis">Tipo de Análisis:</label>
        <select id="tipo-analisis">
          <option value="Normal">Normal</option>
          <option value="Urgente">Urgente</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notas-agente">Notas del Agente:</label>
        <textarea id="notas-agente" rows="2" placeholder="Observaciones de compra/ruta..."></textarea>
      </div>

      <button type="submit">Generar y Registrar Muestra</button>
    </form>
  </div>

  <!-- LISTA DE MUESTRAS EN COLUMNAS PLEGABLES -->
  <h2>Tablero de Control de Muestras</h2>
  <div id="lista-muestras" class="tablero-columnas">
    <div class="loading">Cargando muestras desde Google Sheets...</div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyEDNiC-m1U5XLQuaeP47TTV0X9r56zrIS-kYGub4P3ufTzKuD-7uMA_X-rrnBNkoFG/exec";
const CLAVE_XRF = "xrf123";

let muestras = [];
let proveedoresGuardados = JSON.parse(localStorage.getItem('proveedores_xrf')) || [];
let agentesGuardados = JSON.parse(localStorage.getItem('agentes_xrf')) || [];
let tiposGuardados = JSON.parse(localStorage.getItem('tipos_xrf')) || [];

let rolActual = 'compras';
let autenticadoXRF = false;

document.getElementById('fecha-recolectada').value = new Date().toISOString().split('T')[0];

actualizarListasMemoria();
cargarMuestrasDesdeNube();

function solicitarAccesoXRF() {
  if (autenticadoXRF) {
    cambiarRol('xrf');
    return;
  }
  const password = prompt("Ingrese la contraseña de acceso para la Vista Analista XRF:");
  if (password === CLAVE_XRF) {
    autenticadoXRF = true;
    cambiarRol('xrf');
  } else if (password !== null) {
    alert("Contraseña incorrecta. Acceso denegado.");
  }
}

function cargarMuestrasDesdeNube() {
  const contenedor = document.getElementById('lista-muestras');
  contenedor.innerHTML = '<div class="loading">Sincronizando con Google Sheets...</div>';

  fetch(WEB_APP_URL)
    .then(response => response.json())
    .then(data => {
      muestras = Array.isArray(data) ? data : [];
      actualizarLista();
    })
    .catch(err => {
      console.error("Error al cargar datos:", err);
      contenedor.innerHTML = '<p style="color:red; text-align:center; grid-column: 1/-1;">Error al conectar con la base de datos de Google Sheets.</p>';
    });
}

function cambiarRol(rol) {
  rolActual = rol;
  document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
  if (rol === 'compras') {
    document.getElementById('btn-compras').classList.add('active');
    document.getElementById('seccion-compras').style.display = 'block';
    document.getElementById('btn-borrar-todo').style.display = 'none';
  } else {
    document.getElementById('btn-xrf').classList.add('active');
    document.getElementById('seccion-compras').style.display = 'none';
    document.getElementById('btn-borrar-todo').style.display = 'inline-block';
  }
  actualizarLista();
}

function toggleIngresoBodega(checkbox) {
  const inputFechaIngreso = document.getElementById('fecha-ingreso');
  if (checkbox.checked) {
    inputFechaIngreso.disabled = false;
    inputFechaIngreso.value = new Date().toISOString().split('T')[0];
  } else {
    inputFechaIngreso.disabled = true;
    inputFechaIngreso.value = '';
  }
}

function togglePesoInicial(checkbox) {
  const inputPeso = document.getElementById('peso-inicial');
  if (checkbox.checked) {
    inputPeso.value = '';
    inputPeso.disabled = true;
  } else {
    inputPeso.disabled = false;
  }
}

function formatearFechaLimpia(str) {
  if (!str || str === 'Pendiente') return 'Pendiente';
  if (typeof str === 'string' && str.includes('T')) return str.split('T')[0];
  return str;
}

function actualizarListasMemoria() {
  const datalistProv = document.getElementById('lista-proveedores');
  datalistProv.innerHTML = '';
  proveedoresGuardados.forEach(p => {
    const option = document.createElement('option');
    option.value = p;
    datalistProv.appendChild(option);
  });

  const datalistAgentes = document.getElementById('lista-agentes');
  datalistAgentes.innerHTML = '';
  agentesGuardados.forEach(a => {
    const option = document.createElement('option');
    option.value = a;
    datalistAgentes.appendChild(option);
  });

  const datalistTipos = document.getElementById('lista-tipos');
  datalistTipos.innerHTML = '';
  tiposGuardados.forEach(t => {
    const option = document.createElement('option');
    option.value = t;
    datalistTipos.appendChild(option);
  });
}

function generarCodigo(nombreAgente) {
  const partes = nombreAgente.trim().split(/\s+/);
  const iniciales = (partes[0] ? partes[0][0] : 'X') + (partes[1] ? partes[1][0] : 'X');
  const inicialesUpper = iniciales.toUpperCase();
  const filtradas = muestras.filter(m => m.codigo && m.codigo.startsWith(inicialesUpper));
  const consecutivo = String(filtradas.length + 1).padStart(3, '0');
  return `${inicialesUpper}-${consecutivo}`;
}

document.getElementById('form-compras').addEventListener('submit', function(e) {
  e.preventDefault();

  const sinPeso = document.getElementById('sin-peso').checked;
  const inputPesoValue = document.getElementById('peso-inicial').value;
  const activarIngreso = document.getElementById('activar-ingreso').checked;
  const inputFechaIngresoValue = document.getElementById('fecha-ingreso').value;

  if (!sinPeso && (!inputPesoValue || isNaN(parseFloat(inputPesoValue)))) {
    alert("Por favor ingresa un peso inicial válido o marca la casilla 'No se pudo pesar'.");
    return;
  }

  const proveedor = document.getElementById('proveedor').value.trim().toUpperCase();
  const agente = document.getElementById('agente').value.trim();
  const tipo = document.getElementById('tipo').value.trim();
  const fechaRecolectada = document.getElementById('fecha-recolectada').value;
  
  const pesoInicial = sinPeso ? 'Pendiente' : parseFloat(inputPesoValue);
  const fechaIngreso = (activarIngreso && inputFechaIngresoValue) ? inputFechaIngresoValue : 'Pendiente';

  const tipoAnalisis = document.getElementById('tipo-analisis').value;
  const notasAgente = document.getElementById('notas-agente').value;
  
  const codigo = generarCodigo(agente);

  if (!proveedoresGuardados.includes(proveedor)) {
    proveedoresGuardados.push(proveedor);
    localStorage.setItem('proveedores_xrf', JSON.stringify(proveedoresGuardados));
  }
  if (!agentesGuardados.includes(agente)) {
    agentesGuardados.push(agente);
    localStorage.setItem('agentes_xrf', JSON.stringify(agentesGuardados));
  }
  if (!tiposGuardados.includes(tipo)) {
    tiposGuardados.push(tipo);
    localStorage.setItem('tipos_xrf', JSON.stringify(tiposGuardados));
  }
  actualizarListasMemoria();

  const nuevaMuestra = {
    codigo,
    proveedor,
    agente,
    tipo,
    pesoInicial,
    fechaRecolectada,
    fechaIngreso,
    estatusAnalisis: 'Ingresado y en turno',
    tipoAnalisis,
    fechaAnalisis: '',
    fechaTerminado: 'Pendiente',
    notasAgente,
    notasXrf: '',
    pesoFinal: 'Pendiente'
  };

  guardarEnNube(nuevaMuestra, `Muestra registrada con éxito. Código asignado: ${codigo}`);
  this.reset();
  document.getElementById('fecha-recolectada').value = new Date().toISOString().split('T')[0];
  document.getElementById('fecha-ingreso').disabled = true;
  document.getElementById('peso-inicial').disabled = false;
});

function actualizarLista() {
  const contenedor = document.getElementById('lista-muestras');
  contenedor.innerHTML = '';

  if (muestras.length === 0) {
    contenedor.innerHTML = '<p style="text-align:center; color:#666; grid-column:1/-1;">No hay muestras registradas en la base de datos.</p>';
    return;
  }

  let col1Title = "", col2Title = "", col3Title = "";
  let col1Muestras = [], col2Muestras = [], col3Muestras = [];

  if (rolActual === 'compras') {
    col1Title = "🚚 En Tránsito / Recolectado";
    col2Title = "🏢 En Bodega (Orden Ingreso)";
    col3Title = "✅ Concluidas";

    col1Muestras = muestras.filter(m => m.fechaIngreso === 'Pendiente' || !m.fechaIngreso);
    col2Muestras = muestras.filter(m => m.fechaIngreso && m.fechaIngreso !== 'Pendiente' && m.estatusAnalisis !== 'Terminado');
    col3Muestras = muestras.filter(m => m.estatusAnalisis === 'Terminado');

    col2Muestras.sort((a, b) => new Date(a.fechaIngreso) - new Date(b.fechaIngreso));
  } else {
    col1Title = "📥 En Bodega / Por Analizar";
    col2Title = "🔬 En Proceso";
    col3Title = "✅ Terminado";

    col1Muestras = muestras.filter(m => m.estatusAnalisis === 'Ingresado y en turno');
    col2Muestras = muestras.filter(m => m.estatusAnalisis !== 'Ingresado y en turno' && m.estatusAnalisis !== 'Terminado');
    col3Muestras = muestras.filter(m => m.estatusAnalisis === 'Terminado');

    col1Muestras.sort((a, b) => new Date(a.fechaIngreso) - new Date(b.fechaIngreso));
  }

  contenedor.appendChild(crearColumnaHTML(col1Title, col1Muestras, "col1"));
  contenedor.appendChild(crearColumnaHTML(col2Title, col2Muestras, "col2"));
  contenedor.appendChild(crearColumnaHTML(col3Title, col3Muestras, "col3"));
}

function crearColumnaHTML(titulo, lista, idColumna) {
  const colDiv = document.createElement('div');
  colDiv.className = 'columna';
  colDiv.id = `columna-${idColumna}`;

  colDiv.innerHTML = `
    <div class="columna-titulo" onclick="toggleColumna('${idColumna}')">
      <div>
        <span>${titulo}</span>
        <span class="columna-contador">${lista.length}</span>
      </div>
      <span class="toggle-icono" id="icono-${idColumna}">▼</span>
    </div>
    <div class="columna-contenido" id="contenido-${idColumna}">
      ${lista.length === 0 ? '<p style="text-align:center; font-size:12px; color:#888; padding:15px 0;">Sin muestras en esta fase</p>' : ''}
    </div>
  `;

  const contenidoDiv = colDiv.querySelector(`#contenido-${idColumna}`);

  if (lista.length > 0) {
    lista.forEach(m => {
      const card = crearMuestraCard(m);
      contenidoDiv.appendChild(card);
    });
  }

  return colDiv;
}

function toggleColumna(idColumna) {
  const col = document.getElementById(`columna-${idColumna}`);
  const icono = document.getElementById(`icono-${idColumna}`);
  if (col) {
    col.classList.toggle('plegada');
    if (col.classList.contains('plegada')) {
      icono.textContent = '▲';
    } else {
      icono.textContent = '▼';
    }
  }
}

function plegarTodasColumnas(plegar) {
  const columnas = document.querySelectorAll('.columna');
  columnas.forEach(col => {
    const id = col.id.replace('columna-', '');
    const icono = document.getElementById(`icono-${id}`);
    if (plegar) {
      col.classList.add('plegada');
      if (icono) icono.textContent = '▲';
    } else {
      col.classList.remove('plegada');
      if (icono) icono.textContent = '▼';
    }
  });
}

function crearMuestraCard(m) {
  const div = document.createElement('div');
  
  let iconoEstatus = '⏳';
  let claseEstado = 'estado-esperando';

  if (m.estatusAnalisis === 'Revisión y limpieza') { iconoEstatus = '🧹'; claseEstado = 'estado-limpieza'; }
  else if (m.estatusAnalisis === 'Trituración') { iconoEstatus = '⚙️'; claseEstado = 'estado-trituracion'; }
  else if (m.estatusAnalisis === 'Analizando') { iconoEstatus = '🔬'; claseEstado = 'estado-analizando'; }
  else if (m.estatusAnalisis === 'Terminado') { iconoEstatus = '✅'; claseEstado = 'estado-terminado'; }
  else if (m.estatusAnalisis === 'Retenida por humedad') { iconoEstatus = '💧'; claseEstado = 'estado-humedad'; }
  else if (m.estatusAnalisis === 'Falta de peso') { iconoEstatus = '⚠️'; claseEstado = 'estado-faltapeso'; }

  div.className = `muestra-item ${claseEstado}`;

  let controlesExtra = '';

  if (rolActual === 'compras') {
    const hoy = new Date().toISOString().split('T')[0];
    let bloqueFecha = '';
    let bloquePeso = '';

    if (m.fechaIngreso === 'Pendiente' || m.fechaIngreso === '' || m.fechaIngreso === undefined) {
      bloqueFecha = `
        <div class="card-footer-row">
          <div>
            <label style="font-size:11px;">Fecha Ingreso Bodega:</label>
            <input type="date" id="fechaingreso-compras-${m.codigo}" value="${hoy}">
          </div>
          <button class="btn-accion-xrf" onclick="guardarFechaIngresoCompras('${m.codigo}')">Guardar Fecha</button>
        </div>
      `;
    }

    if (m.pesoInicial === 'Pendiente' || m.pesoInicial === '' || m.pesoInicial === undefined) {
      bloquePeso = `
        <div class="card-footer-row">
          <div>
            <label style="font-size:11px;">Peso Inicial (kg):</label>
            <input type="number" step="0.01" id="pesoinicial-compras-${m.codigo}" placeholder="Ej. 12.5">
          </div>
          <button class="btn-accion-xrf" onclick="guardarPesoInicialCompras('${m.codigo}')">Guardar Peso</button>
        </div>
      `;
    }

    controlesExtra = bloqueFecha + bloquePeso;
  }

  if (rolActual === 'xrf') {
    const pesoFinalActual = (m.pesoFinal === 'Pendiente' || m.pesoFinal === undefined || m.pesoFinal === '') ? '' : m.pesoFinal;
    controlesExtra = `
      <div style="background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px dashed var(--border-color); margin-bottom: 5px;">
        <label style="font-weight:600; color:var(--primary-dark); font-size:11px;">✏️ Corregir Datos de Origen:</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom:4px;">
          <input type="text" id="corr-proveedor-${m.codigo}" value="${m.proveedor}" placeholder="Proveedor" style="padding:4px; font-size:11px;">
          <input type="text" id="corr-agente-${m.codigo}" value="${m.agente}" placeholder="Agente" style="padding:4px; font-size:11px;">
          <input type="text" id="corr-tipo-${m.codigo}" value="${m.tipo}" placeholder="Tipo" style="padding:4px; font-size:11px;">
        </div>
        <button class="btn-accion-xrf" style="height:30px; width:100%; font-size:11px;" onclick="guardarCorreccionesXRF('${m.codigo}')">Guardar Corrección</button>
      </div>

      <div class="card-footer-row">
        <div>
          <label style="font-size:11px;">Estatus XRF:</label>
          <select id="estatus-${m.codigo}" style="padding:6px; font-size:12px;">
            <option value="Ingresado y en turno" ${m.estatusAnalisis === 'Ingresado y en turno' ? 'selected' : ''}>⏳ Ingresado y en turno</option>
            <option value="Revisión y limpieza" ${m.estatusAnalisis === 'Revisión y limpieza' ? 'selected' : ''}>🧹 Revisión y limpieza</option>
            <option value="Trituración" ${m.estatusAnalisis === 'Trituración' ? 'selected' : ''}>⚙️ Trituración</option>
            <option value="Analizando" ${m.estatusAnalisis === 'Analizando' ? 'selected' : ''}>🔬 Analizando</option>
            <option value="Terminado" ${m.estatusAnalisis === 'Terminado' ? 'selected' : ''}>✅ Terminado</option>
            <option value="Retenida por humedad" ${m.estatusAnalisis === 'Retenida por humedad' ? 'selected' : ''}>💧 Retenida por humedad</option>
            <option value="Falta de peso" ${m.estatusAnalisis === 'Falta de peso' ? 'selected' : ''}>⚠️ Falta de peso</option>
          </select>
        </div>
        <button class="btn-accion-xrf" onclick="guardarEstatusXRF('${m.codigo}')">Guardar Estatus</button>
      </div>

      <div class="card-footer-row">
        <div>
          <label style="font-size:11px;">Peso Final / Neto (kg):</label>
          <input type="number" step="0.01" id="pesofinal-${m.codigo}" value="${pesoFinalActual}" placeholder="Ej. 11.8" style="padding:6px; font-size:12px;">
        </div>
        <button class="btn-accion-xrf" onclick="guardarPesoFinalXRF('${m.codigo}')">Guardar Peso Final</button>
      </div>

      <div class="card-footer-row" style="border-top:1px dashed var(--border-color); padding-top:6px;">
        <div style="flex-grow:1;">
          <input type="text" id="notasxrf-${m.codigo}" value="${m.notasXrf || ''}" placeholder="Notas XRF..." style="padding:6px; font-size:11px;">
        </div>
        <button class="btn-accion-xrf" style="height:34px;" onclick="ingresarNota('${m.codigo}')">Nota</button>
        <button class="btn-danger" style="height:34px; border-radius:6px; padding:0 8px; font-size:11px;" onclick="confirmarBorrarMuestra('${m.codigo}')">🗑️</button>
      </div>
    `;
  }

  const pesoInicialHtml = (m.pesoInicial === 'Pendiente' || m.pesoInicial === '' || m.pesoInicial === undefined) 
    ? `<span style="color:var(--danger-color); font-weight:bold;">Pendiente</span>` 
    : `${m.pesoInicial} kg`;

  const fechaIngresoHtml = (m.fechaIngreso === 'Pendiente' || m.fechaIngreso === '' || m.fechaIngreso === undefined)
    ? `<span style="color:var(--danger-color); font-weight:bold;">Pendiente</span>`
    : formatearFechaLimpia(m.fechaIngreso);

  const fechaTerminadoHtml = (m.fechaTerminado && m.fechaTerminado !== 'Pendiente')
    ? `<br><span class="fecha">Terminado: <strong>${formatearFechaLimpia(m.fechaTerminado)}</strong></span>`
    : '';

  const badgeProv = m.proveedorCorregido ? '<span class="badge-corregido">Corregido</span>' : '';
  const badgeAgente = m.agenteCorregido ? '<span class="badge-corregido">Corregido</span>' : '';
  const badgeTipo = m.tipoCorregido ? '<span class="badge-corregido">Corregido</span>' : '';

  const pesoFinalDisplay = (m.pesoFinal === 'Pendiente' || m.pesoFinal === '' || m.pesoFinal === undefined) 
    ? '<span style="color:var(--danger-color);">Pendiente</span>' 
    : `${m.pesoFinal} kg`;

  div.innerHTML = `
    <div class="card-header">
      <div>
        <span class="codigo">${m.codigo}</span>
      </div>
      <div style="text-align:right;">
        <span class="fecha">Rec: <strong>${formatearFechaLimpia(m.fechaRecolectada)}</strong></span><br>
        <span class="fecha">Ing: <strong>${fechaIngresoHtml}</strong></span>
        ${fechaTerminadoHtml}
      </div>
    </div>
    <div class="card-body">
      <div>
        <strong>Prov:</strong> ${m.proveedor} ${badgeProv}<br>
        <strong>Agente:</strong> ${m.agente} ${badgeAgente}<br>
        <strong>Tipo:</strong> ${m.tipo} ${badgeTipo}<br>
        <strong>P. Inic:</strong> ${pesoInicialHtml}
      </div>
      <div>
        <strong>Análisis:</strong> ${m.tipoAnalisis}<br>
        <strong>Estatus:</strong> <span style="font-weight:bold;">${iconoEstatus} ${m.estatusAnalisis}</span><br>
        <strong>P. Final:</strong> ${pesoFinalDisplay}<br>
        <strong>Nota Ag:</strong> ${m.notasAgente || 'Ninguna'}<br>
        <strong>Nota XRF:</strong> ${m.notasXrf || 'Ninguna'}
      </div>
    </div>
    ${controlesExtra}
  `;
  return div;
}

function guardarFechaIngresoCompras(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const valorFechaIngreso = document.getElementById(`fechaingreso-compras-${codigo}`).value;
    if (!valorFechaIngreso) {
      alert("Por favor selecciona una fecha válida.");
      return;
    }
    m.fechaIngreso = valorFechaIngreso;
    guardarEnNube(m, `Muestra ${codigo} ingresada a bodega.`);
  }
}

function guardarPesoInicialCompras(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const valorPeso = document.getElementById(`pesoinicial-compras-${codigo}`).value;
    if (!valorPeso || valorPeso <= 0) {
      alert("Por favor ingresa un peso inicial válido.");
      return;
    }
    m.pesoInicial = parseFloat(valorPeso);
    guardarEnNube(m, `Peso inicial guardado para la muestra ${codigo}`);
  }
}

function guardarEstatusXRF(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const selectEstatus = document.getElementById(`estatus-${codigo}`).value;
    m.estatusAnalisis = selectEstatus;
    const hoy = new Date().toISOString().split('T')[0];
    m.fechaAnalisis = hoy;

    if (selectEstatus === 'Terminado') {
      m.fechaTerminado = hoy;
    } else {
      m.fechaTerminado = 'Pendiente';
    }

    guardarEnNube(m, `Estatus actualizado a '${selectEstatus}' para la muestra ${codigo}`);
  }
}

function guardarPesoFinalXRF(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const inputPeso = document.getElementById(`pesofinal-${codigo}`).value;
    if (inputPeso !== '' && !isNaN(parseFloat(inputPeso))) {
      m.pesoFinal = parseFloat(inputPeso);
    } else {
      m.pesoFinal = 'Pendiente';
    }
    m.fechaAnalisis = new Date().toISOString().split('T')[0];
    guardarEnNube(m, `Peso final guardado para la muestra ${codigo}`);
  }
}

function guardarCorreccionesXRF(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const nuevoProv = document.getElementById(`corr-proveedor-${codigo}`).value.trim().toUpperCase();
    const nuevoAgente = document.getElementById(`corr-agente-${codigo}`).value.trim();
    const nuevoTipo = document.getElementById(`corr-tipo-${codigo}`).value.trim();

    if (nuevoProv !== m.proveedor) { m.proveedor = nuevoProv; m.proveedorCorregido = true; }
    if (nuevoAgente !== m.agente) { m.agente = nuevoAgente; m.agenteCorregido = true; }
    if (nuevoTipo !== m.tipo) { m.tipo = nuevoTipo; m.tipoCorregido = true; }

    guardarEnNube(m, `Correcciones guardadas para la muestra ${codigo}`);
  }
}

function ingresarNota(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const inputNotas = document.getElementById(`notasxrf-${codigo}`).value;
    m.notasXrf = inputNotas;
    guardarEnNube(m, `Nota ingresada para la muestra ${codigo}`);
  }
}

function confirmarBorrarMuestra(codigo) {
  const confirmacion1 = confirm(`¿Estás seguro de que deseas eliminar la muestra ${codigo}?`);
  if (confirmacion1) {
    const confirmacion2 = prompt(`Para confirmar el borrado definitivo de ${codigo}, escribe exactamente el código de la muestra:`);
    if (confirmacion2 === codigo) {
      guardarEnNube({ action: 'delete', codigo: codigo }, `La muestra ${codigo} ha sido eliminada con éxito.`);
    } else if (confirmacion2 !== null) {
      alert("El código ingresado no coincide. Operación cancelada.");
    }
  }
}

function confirmarBorrarTodo() {
  const confirmacion1 = confirm("⚠️ ¡ATENCIÓN! Estás a punto de borrar TODAS las muestras del sistema.");
  if (confirmacion1) {
    const confirmacion2 = prompt("Escribe 'ELIMINAR TODO' en mayúsculas para confirmar la acción:");
    if (confirmacion2 === "ELIMINAR TODO") {
      guardarEnNube({ action: 'deleteAll' }, "Se han borrado todas las muestras de la base de datos.");
    } else if (confirmacion2 !== null) {
      alert("Texto de confirmación incorrecto. Operación cancelada.");
    }
  }
}

function guardarEnNube(muestraData, mensajeExito) {
  fetch(WEB_APP_URL, {
    method: 'POST',
    body: JSON.stringify(muestraData)
  })
  .then(() => {
    alert(mensajeExito);
    cargarMuestrasDesdeNube();
  })
  .catch(err => {
    console.error("Error guardando en nube:", err);
    alert("Hubo un detalle al guardar en la nube. Revisa tu conexión.");
  });
}
</script>
</body>
</html>
