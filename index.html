<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión XRF Centralizado</title>
<style>
:root {
  --primary-color: #0066cc;
  --primary-light: #e6f2ff;
  --primary-dark: #004080;
  --secondary-color: #f8f9fa;
  --border-color: #d1e0f0;
  --text-color: #333333;
  --text-light: #666666;
  --success-color: #28a745;
  --warning-color: #ffcc00;
  --danger-color: #cc0000;
  --radius: 12px;
  --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: var(--text-color); margin: 0; padding: 20px; }
.container { max-width: 900px; margin: auto; }

h1 { color: var(--primary-dark); font-size: 28px; margin-bottom: 25px; text-align: center; font-weight: 600; }
h2 { color: var(--primary-dark); font-size: 20px; margin-bottom: 15px; border-bottom: 2px solid var(--primary-light); padding-bottom: 8px; }

.header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.btn-refrescar { background-color: #17a2b8; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn-refrescar:hover { background-color: #138496; }

.role-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
.role-btn { padding: 10px 20px; border: 2px solid var(--primary-color); background: white; color: var(--primary-color); font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.role-btn.active { background: var(--primary-color); color: white; }

form, .vista-panel { background: white; padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 30px; border: 1px solid var(--border-color); }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-color); }
input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background-color: var(--secondary-color); transition: border-color 0.2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); }

.checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 13px; color: var(--text-light); }
.checkbox-container input { width: auto; }

button[type="submit"] { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; padding: 12px; border-radius: 8px; width: 100%; transition: background-color 0.2s; }
button[type="submit"]:hover { background-color: var(--primary-dark); }

.btn-accion-xrf { background-color: var(--primary-color); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s; white-space: nowrap; height: 45px; }
.btn-accion-xrf:hover { background-color: var(--primary-dark); }

.muestra-item { background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.muestra-item::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }

/* Estados de color */
.muestra-item.estado-esperando::after { background-color: #6c757d; }
.muestra-item.estado-limpieza::after { background-color: #17a2b8; }
.muestra-item.estado-trituracion::after { background-color: #ff9900; }
.muestra-item.estado-analizando::after { background-color: #0066cc; }
.muestra-item.estado-terminado::after { background-color: #28a745; }
.muestra-item.estado-humedad::after { background-color: #6f42c1; }
.muestra-item.estado-faltapeso::after { background-color: #dc3545; }

.card-header { display: flex; justify-content: space-between; align-items: center; }
.codigo { font-family: monospace; font-size: 14px; font-weight: 600; color: var(--primary-color); background-color: var(--primary-light); padding: 4px 8px; border-radius: 6px; }
.fecha { font-size: 12px; color: var(--text-light); }
.card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; color: var(--text-light); }
.card-body strong { color: var(--text-color); }
.card-footer { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: flex-end; border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 5px; }
.loading { text-align: center; color: var(--primary-color); font-weight: 600; padding: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>Sistema de Gestión XRF Centralizado</h1>

  <div class="header-bar">
    <div class="role-selector" style="margin-bottom:0;">
      <button class="role-btn active" id="btn-compras" onclick="cambiarRol('compras')">Vista: Agente de Compras</button>
      <button class="role-btn" id="btn-xrf" onclick="solicitarAccesoXRF()">Vista: Analista XRF 🔒</button>
    </div>
    <button class="btn-refrescar" onclick="cargarMuestrasDesdeNube()">🔄 Sincronizar</button>
  </div>

  <!-- SECCIÓN COMPRAS -->
  <div id="seccion-compras">
    <h2>Registrar Nueva Muestra</h2>
    <form id="form-compras">
      <div class="form-group">
        <label for="proveedor">Proveedor:</label>
        <input type="text" id="proveedor" list="lista-proveedores" placeholder="Escribe o selecciona proveedor..." required>
        <datalist id="lista-proveedores"></datalist>
      </div>

      <div class="form-group">
        <label for="agente">Agente de Compras:</label>
        <input type="text" id="agente" list="lista-agentes" placeholder="Escribe tu primer nombre y primer apellido" required>
        <datalist id="lista-agentes"></datalist>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de Cerámica:</label>
        <input type="text" id="tipo" list="lista-tipos" placeholder="Ej. Gasolina, Diesel, etc." required>
        <datalist id="lista-tipos"></datalist>
      </div>

      <div class="form-group">
        <label for="fecha-recolectada">Fecha Recolectada:</label>
        <input type="date" id="fecha-recolectada" required>
      </div>

      <div class="form-group">
        <label for="peso-inicial">Peso Inicial (kg):</label>
        <input type="number" step="0.01" id="peso-inicial" placeholder="Ej. 12.5" required>
        <div class="checkbox-container">
          <input type="checkbox" id="sin-peso" onchange="togglePesoInicial(this)">
          <label for="sin-peso" style="margin-bottom:0; display:inline; font-weight:normal;">No se pudo pesar / Ingresar después</label>
        </div>
      </div>

      <div class="form-group">
        <label for="tipo-analisis">Tipo de Análisis:</label>
        <select id="tipo-analisis">
          <option value="Normal">Normal</option>
          <option value="Urgente">Urgente</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notas-agente">Notas del Agente:</label>
        <textarea id="notas-agente" rows="2" placeholder="Observaciones de compra..."></textarea>
      </div>

      <button type="submit">Generar y Registrar Muestra</button>
    </form>
  </div>

  <!-- LISTA DE MUESTRAS -->
  <h2>Lista General de Muestras</h2>
  <div id="lista-muestras">
    <div class="loading">Cargando muestras desde Google Sheets...</div>
  </div>
</div>

<script>
// URL DE LA APLICACIÓN WEB DE GOOGLE APPS SCRIPT ACTUALIZADA
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzCSc5zubYksbEH9d0RzGDpEB7g2tLqdLmYEgEkN6jzAXHZtZl98FzE2HwrJBymWek/exec";

// CONTRASEÑA DE ACCESO PARA LA VISTA DE ANALISTA XRF
const CLAVE_XRF = "xrf123";

let muestras = [];
let proveedoresGuardados = JSON.parse(localStorage.getItem('proveedores_xrf')) || [];
let agentesGuardados = JSON.parse(localStorage.getItem('agentes_xrf')) || [];
let tiposGuardados = JSON.parse(localStorage.getItem('tipos_xrf')) || [];

let rolActual = 'compras';
let autenticadoXRF = false;

// Establecer fecha actual por defecto en "Fecha Recolectada"
document.getElementById('fecha-recolectada').value = new Date().toISOString().split('T')[0];

actualizarListasMemoria();
cargarMuestrasDesdeNube();

function solicitarAccesoXRF() {
  if (autenticadoXRF) {
    cambiarRol('xrf');
    return;
  }
  const password = prompt("Ingrese la contraseña de acceso para la Vista Analista XRF:");
  if (password === CLAVE_XRF) {
    autenticadoXRF = true;
    cambiarRol('xrf');
  } else if (password !== null) {
    alert("Contraseña incorrecta. Acceso denegado.");
  }
}

function cargarMuestrasDesdeNube() {
  const contenedor = document.getElementById('lista-muestras');
  contenedor.innerHTML = '<div class="loading">Sincronizando con Google Sheets...</div>';

  fetch(WEB_APP_URL)
    .then(response => response.json())
    .then(data => {
      muestras = data;
      actualizarLista();
    })
    .catch(err => {
      console.error("Error al cargar datos:", err);
      contenedor.innerHTML = '<p style="color:red; text-align:center;">Error al conectar con la base de datos de Google Sheets.</p>';
    });
}

function cambiarRol(rol) {
  rolActual = rol;
  document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
  if (rol === 'compras') {
    document.getElementById('btn-compras').classList.add('active');
    document.getElementById('seccion-compras').style.display = 'block';
  } else {
    document.getElementById('btn-xrf').classList.add('active');
    document.getElementById('seccion-compras').style.display = 'none';
  }
  actualizarLista();
}

function togglePesoInicial(checkbox) {
  const inputPeso = document.getElementById('peso-inicial');
  if (checkbox.checked) {
    inputPeso.value = '';
    inputPeso.disabled = true;
    inputPeso.required = false;
  } else {
    inputPeso.disabled = false;
    inputPeso.required = true;
  }
}

function actualizarListasMemoria() {
  const datalistProv = document.getElementById('lista-proveedores');
  datalistProv.innerHTML = '';
  proveedoresGuardados.forEach(p => {
    const option = document.createElement('option');
    option.value = p;
    datalistProv.appendChild(option);
  });

  const datalistAgentes = document.getElementById('lista-agentes');
  datalistAgentes.innerHTML = '';
  agentesGuardados.forEach(a => {
    const option = document.createElement('option');
    option.value = a;
    datalistAgentes.appendChild(option);
  });

  const datalistTipos = document.getElementById('lista-tipos');
  datalistTipos.innerHTML = '';
  tiposGuardados.forEach(t => {
    const option = document.createElement('option');
    option.value = t;
    datalistTipos.appendChild(option);
  });
}

function generarCodigo(nombreAgente) {
  const partes = nombreAgente.trim().split(/\s+/);
  const iniciales = (partes[0] ? partes[0][0] : 'X') + (partes[1] ? partes[1][0] : 'X');
  const inicialesUpper = iniciales.toUpperCase();
  const filtradas = muestras.filter(m => m.codigo && m.codigo.startsWith(inicialesUpper));
  const consecutivo = String(filtradas.length + 1).padStart(3, '0');
  return `${inicialesUpper}-${consecutivo}`;
}

document.getElementById('form-compras').addEventListener('submit', function(e) {
  e.preventDefault();

  const proveedor = document.getElementById('proveedor').value.trim().toUpperCase();
  const agente = document.getElementById('agente').value.trim();
  const tipo = document.getElementById('tipo').value.trim();
  const fechaRecolectada = document.getElementById('fecha-recolectada').value;
  const sinPeso = document.getElementById('sin-peso').checked;
  const pesoInicial = sinPeso ? 'Pendiente' : parseFloat(document.getElementById('peso-inicial').value);
  const tipoAnalisis = document.getElementById('tipo-analisis').value;
  const notasAgente = document.getElementById('notas-agente').value;
  
  const codigo = generarCodigo(agente);
  
  // Si no se pesó, la Fecha de Ingreso queda pendiente hasta que Compras la pese e ingrese
  const fechaIngreso = sinPeso ? 'Pendiente' : new Date().toLocaleString();

  if (!proveedoresGuardados.includes(proveedor)) {
    proveedoresGuardados.push(proveedor);
    localStorage.setItem('proveedores_xrf', JSON.stringify(proveedoresGuardados));
  }
  if (!agentesGuardados.includes(agente)) {
    agentesGuardados.push(agente);
    localStorage.setItem('agentes_xrf', JSON.stringify(agentesGuardados));
  }
  if (!tiposGuardados.includes(tipo)) {
    tiposGuardados.push(tipo);
    localStorage.setItem('tipos_xrf', JSON.stringify(tiposGuardados));
  }
  actualizarListasMemoria();

  const nuevaMuestra = {
    codigo,
    proveedor,
    agente,
    tipo,
    pesoInicial,
    fechaRecolectada,
    fechaIngreso,
    estatusAnalisis: 'Ingresado y en turno',
    tipoAnalisis,
    fechaAnalisis: '',
    notasAgente,
    notasXrf: '',
    pesoFinal: 'Pendiente'
  };

  guardarEnNube(nuevaMuestra, `Muestra registrada con éxito. Código asignado: ${codigo}`);
  this.reset();
  document.getElementById('fecha-recolectada').value = new Date().toISOString().split('T')[0];
  document.getElementById('peso-inicial').disabled = false;
  document.getElementById('peso-inicial').required = true;
});

function actualizarLista() {
  const contenedor = document.getElementById('lista-muestras');
  contenedor.innerHTML = '';

  if (muestras.length === 0) {
    contenedor.innerHTML = '<p style="text-align:center; color:#666;">No hay muestras registradas en la base de datos.</p>';
    return;
  }

  muestras.forEach((m) => {
    const div = document.createElement('div');
    
    let iconoEstatus = '⏳';
    let claseEstado = 'estado-esperando';

    if (m.estatusAnalisis === 'Revisión y limpieza') { iconoEstatus = '🧹'; claseEstado = 'estado-limpieza'; }
    else if (m.estatusAnalisis === 'Trituración') { iconoEstatus = '⚙️'; claseEstado = 'estado-trituracion'; }
    else if (m.estatusAnalisis === 'Analizando') { iconoEstatus = '🔬'; claseEstado = 'estado-analizando'; }
    else if (m.estatusAnalisis === 'Terminado') { iconoEstatus = '✅'; claseEstado = 'estado-terminado'; }
    else if (m.estatusAnalisis === 'Retenida por humedad') { iconoEstatus = '💧'; claseEstado = 'estado-humedad'; }
    else if (m.estatusAnalisis === 'Falta de peso') { iconoEstatus = '⚠️'; claseEstado = 'estado-faltapeso'; }

    div.className = `muestra-item ${claseEstado}`;

    let controlesExtra = '';

    // Controles para el Agente de Compras (si el peso está pendiente)
    if (rolActual === 'compras' && (m.pesoInicial === 'Pendiente' || m.pesoInicial === '' || m.pesoInicial === undefined)) {
      controlesExtra = `
        <div class="card-footer" style="grid-template-columns: 1fr auto;">
          <div>
            <label>Ingresar Peso Inicial (kg):</label>
            <input type="number" step="0.01" id="pesoinicial-compras-${m.codigo}" placeholder="Ej. 12.5">
          </div>
          <div>
            <button class="btn-accion-xrf" onclick="completarPesoCompras('${m.codigo}')">Guardar Peso e Ingreso</button>
          </div>
        </div>
      `;
    }

    // Controles para el Analista XRF
    if (rolActual === 'xrf') {
      const pesoFinalActual = (m.pesoFinal === 'Pendiente' || m.pesoFinal === undefined || m.pesoFinal === '') ? '' : m.pesoFinal;
      controlesExtra = `
        <div class="card-footer">
          <div>
            <label>Estatus XRF:</label>
            <select id="estatus-${m.codigo}">
              <option value="Ingresado y en turno" ${m.estatusAnalisis === 'Ingresado y en turno' ? 'selected' : ''}>⏳ Ingresado y en turno</option>
              <option value="Revisión y limpieza" ${m.estatusAnalisis === 'Revisión y limpieza' ? 'selected' : ''}>🧹 Revisión y limpieza</option>
              <option value="Trituración" ${m.estatusAnalisis === 'Trituración' ? 'selected' : ''}>⚙️ Trituración</option>
              <option value="Analizando" ${m.estatusAnalisis === 'Analizando' ? 'selected' : ''}>🔬 Analizando</option>
              <option value="Terminado" ${m.estatusAnalisis === 'Terminado' ? 'selected' : ''}>✅ Terminado</option>
              <option value="Retenida por humedad" ${m.estatusAnalisis === 'Retenida por humedad' ? 'selected' : ''}>💧 Retenida por humedad</option>
              <option value="Falta de peso" ${m.estatusAnalisis === 'Falta de peso' ? 'selected' : ''}>⚠️ Falta de peso</option>
            </select>
          </div>
          <div>
            <label>Peso Final / Neto (kg):</label>
            <input type="number" step="0.01" id="pesofinal-${m.codigo}" value="${pesoFinalActual}" placeholder="Ej. 11.8">
          </div>
          <div>
            <button class="btn-accion-xrf" onclick="actualizarPeso('${m.codigo}')">Actualizar peso</button>
          </div>
        </div>
        <div style="margin-top:12px; display:flex; gap:10px; align-items:flex-end; border-top:1px dashed var(--border-color); padding-top:10px;">
          <div style="flex-grow:1;">
            <label>Notas XRF:</label>
            <input type="text" id="notasxrf-${m.codigo}" value="${m.notasXrf || ''}" placeholder="Escribe notas del análisis...">
          </div>
          <div>
            <button class="btn-accion-xrf" onclick="ingresarNota('${m.codigo}')">Ingresar nota</button>
          </div>
        </div>
      `;
    }

    const pesoInicialHtml = (m.pesoInicial === 'Pendiente' || m.pesoInicial === '' || m.pesoInicial === undefined) 
      ? `<span style="color:var(--danger-color); font-weight:bold;">Pendiente de pesar</span>` 
      : `${m.pesoInicial} kg`;

    const fechaIngresoHtml = (m.fechaIngreso === 'Pendiente' || m.fechaIngreso === '' || m.fechaIngreso === undefined)
      ? `<span style="color:var(--danger-color); font-weight:bold;">Pendiente</span>`
      : m.fechaIngreso;

    const pesoFinalDisplay = (m.pesoFinal === 'Pendiente' || m.pesoFinal === '' || m.pesoFinal === undefined) 
      ? '<span style="color:var(--danger-color);">Pendiente</span>' 
      : `${m.pesoFinal} kg`;

    div.innerHTML = `
      <div class="card-header">
        <div>
          <span class="codigo">${m.codigo}</span>
        </div>
        <div style="text-align:right;">
          <span class="fecha">Recolectada: ${m.fechaRecolectada || 'No especificada'}</span><br>
          <span class="fecha">Ingreso Sistema: ${fechaIngresoHtml}</span>
        </div>
      </div>
      <div class="card-body">
        <div>
          <strong>Proveedor:</strong> ${m.proveedor}<br>
          <strong>Agente:</strong> ${m.agente}<br>
          <strong>Tipo:</strong> ${m.tipo}<br>
          <strong>Peso Inicial:</strong> ${pesoInicialHtml}
        </div>
        <div>
          <strong>Tipo Análisis:</strong> ${m.tipoAnalisis}<br>
          <strong>Estatus:</strong> <span style="font-weight:bold;">${iconoEstatus} ${m.estatusAnalisis}</span><br>
          <strong>Peso Final:</strong> ${pesoFinalDisplay}<br>
          <strong>Notas Agente:</strong> ${m.notasAgente || 'Ninguna'}<br>
          <strong>Notas XRF:</strong> ${m.notasXrf || 'Ninguna'}
        </div>
      </div>
      ${controlesExtra}
    `;
    contenedor.appendChild(div);
  });
}

function completarPesoCompras(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const valorPeso = document.getElementById(`pesoinicial-compras-${codigo}`).value;
    if (!valorPeso || valorPeso <= 0) {
      alert("Por favor ingrese un peso inicial válido.");
      return;
    }
    m.pesoInicial = parseFloat(valorPeso);
    m.fechaIngreso = new Date().toLocaleString(); // Registra la fecha exacta de ingreso al ser pesado
    guardarEnNube(m, `Peso inicial y fecha de ingreso registrados para la muestra ${codigo}`);
  }
}

function actualizarPeso(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const inputPeso = document.getElementById(`pesofinal-${codigo}`).value;
    let selectEstatus = document.getElementById(`estatus-${codigo}`).value;

    if (inputPeso !== '') {
      m.pesoFinal = parseFloat(inputPeso);
      if (selectEstatus === 'Ingresado y en turno') {
        selectEstatus = 'Terminado';
      }
    } else {
      m.pesoFinal = 'Pendiente';
    }

    m.estatusAnalisis = selectEstatus;
    m.fechaAnalisis = new Date().toLocaleString();

    guardarEnNube(m, `Peso actualizado para la muestra ${codigo}`);
  }
}

function ingresarNota(codigo) {
  const m = muestras.find(item => item.codigo === codigo);
  if (m) {
    const inputNotas = document.getElementById(`notasxrf-${codigo}`).value;
    m.notasXrf = inputNotas;
    guardarEnNube(m, `Nota ingresada para la muestra ${codigo}`);
  }
}

function guardarEnNube(muestraData, mensajeExito) {
  fetch(WEB_APP_URL, {
    method: 'POST',
    body: JSON.stringify(muestraData)
  })
  .then(() => {
    alert(mensajeExito);
    cargarMuestrasDesdeNube();
  })
  .catch(err => {
    console.error("Error guardando en nube:", err);
    alert("Hubo un detalle al guardar en la nube. Revisa tu conexión.");
  });
}
</script>
</body>
</html>
