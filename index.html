<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión XRF Centralizado</title>
<style>
:root {
  --primary-color: #0066cc;
  --primary-light: #e6f2ff;
  --primary-dark: #004080;
  --secondary-color: #f8f9fa;
  --border-color: #d1e0f0;
  --text-color: #333333;
  --text-light: #666666;
  --success-color: #28a745;
  --warning-color: #ffcc00;
  --danger-color: #dc3545;
  --radius: 12px;
  --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: var(--text-color); margin: 0; padding: 20px; }
.container { max-width: 900px; margin: auto; }

h1 { color: var(--primary-dark); font-size: 28px; margin-bottom: 25px; text-align: center; font-weight: 600; }
h2 { color: var(--primary-dark); font-size: 20px; margin-bottom: 15px; border-bottom: 2px solid var(--primary-light); padding-bottom: 8px; }

.header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.btn-refrescar { background-color: #17a2b8; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn-refrescar:hover { background-color: #138496; }
.btn-danger { background-color: var(--danger-color); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn-danger:hover { background-color: #bd2130; }

.role-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
.role-btn { padding: 10px 20px; border: 2px solid var(--primary-color); background: white; color: var(--primary-color); font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.role-btn.active { background: var(--primary-color); color: white; }

form, .vista-panel { background: white; padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 30px; border: 1px solid var(--border-color); }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-color); }
input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background-color: var(--secondary-color); transition: border-color 0.2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); }

.checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 13px; color: var(--text-light); }
.checkbox-container input { width: auto; }

button[type="submit"] { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; padding: 12px; border-radius: 8px; width: 100%; transition: background-color 0.2s; }
button[type="submit"]:hover { background-color: var(--primary-dark); }

.btn-accion-xrf { background-color: var(--primary-color); color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; white-space: nowrap; height: 42px; }
.btn-accion-xrf:hover { background-color: var(--primary-dark); }

.muestra-item { background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.muestra-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; }

/* Código de Colores de Estatus */
.muestra-item.estado-esperando::before { background-color: #6c757d; }
.muestra-item.estado-limpieza::before { background-color: #17a2b8; }
.muestra-item.estado-trituracion::before { background-color: #ff9900; }
.muestra-item.estado-analizando::before { background-color: #0066cc; }
.muestra-item.estado-terminado::before { background-color: #28a745; }
.muestra-item.estado-humedad::before { background-color: #6f42c1; }
.muestra-item.estado-faltapeso::before { background-color: #dc3545; }

.card-header { display: flex; justify-content: space-between; align-items: center; }
.codigo { font-family: monospace; font-size: 14px; font-weight: 600; color: var(--primary-color); background-color: var(--primary-light); padding: 4px 8px; border-radius: 6px; }
.fecha { font-size: 12px; color: var(--text-light); }
.card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; color: var(--text-light); }
.card-body strong { color: var(--text-color); }
.card-footer-row { display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 5px; }
.card-footer-row > div { flex-grow: 1; }
.loading { text-align: center; color: var(--primary-color); font-weight: 600; padding: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>Sistema de Gestión XRF Centralizado</h1>

  <div class="header-bar">
    <div class="role-selector" style="margin-bottom:0;">
      <button class="role-btn active" id="btn-compras" onclick="cambiarRol('compras')">Vista: Agente de Compras</button>
      <button class="role-btn" id="btn-xrf" onclick="solicitarAccesoXRF()">Vista: Analista XRF 🔒</button>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-refrescar" onclick="cargarMuestrasDesdeNube()">🔄 Sincronizar</button>
      <button class="btn-danger" id="btn-borrar-todo" style="display:none;" onclick="confirmarBorrarTodo()">⚠️ Borrar Todo</button>
    </div>
  </div>

  <!-- SECCIÓN COMPRAS -->
  <div id="seccion-compras">
    <h2>Registrar Nueva Muestra</h2>
    <form id="form-compras">
      <div class="form-group">
        <label for="proveedor">Proveedor:</label>
        <input type="text" id="proveedor" list="lista-proveedores" placeholder="Escribe o selecciona proveedor..." required>
        <datalist id="lista-proveedores"></datalist>
      </div>

      <div class="form-group">
        <label for="agente">Agente de Compras:</label>
        <input type="text" id="agente" list="lista-agentes" placeholder="Escribe tu primer nombre y primer apellido" required>
        <datalist id="lista-agentes"></datalist>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de Cerámica:</label>
        <input type="text" id="tipo" list="lista-tipos" placeholder="Ej. Gasolina, Diesel, etc." required>
        <datalist id="lista-tipos"></datalist>
      </div>

      <div class="form-group">
        <label for="fecha-recolectada">Fecha Recolectada (Día de compra/recolección):</label>
        <input type="date" id="fecha-recolectada" required>
      </div>

      <div class="form-group">
        <label for="fecha-ingreso">Fecha de Ingreso a Bodega (Inicio de turno/cuenta):</label>
        <input type="date" id="fecha-ingreso">
        <span style="font-size:12px; color:#666;">Dejar en blanco si aún está en tránsito/foránea.</span>
      </div>

      <div class="form-group">
        <label for="peso-inicial">Peso Inicial (kg):</label>
        <input type="number" step="0.01" id="peso-inicial" placeholder="Ej. 12.5">
        <div class="checkbox-container">
          <input type="checkbox" id="sin-peso" onchange="togglePesoInicial(this)">
          <label for="sin-peso" style="margin-bottom:0; display:inline; font-weight:normal;">No se pudo pesar / Ingresar después al llegar a bodega</label>
        </div>
      </div>

      <div class="form-group">
        <label for="tipo-analisis">Tipo de Análisis:</label>
        <select id="tipo-analisis">
          <option value="Normal">Normal</option>
          <option value="Urgente">Urgente</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notas-agente">Notas del Agente:</label>
        <textarea id="notas-agente" rows="2" placeholder="Observaciones de compra/ruta..."></textarea>
      </div>

      <button type="submit">Generar y Registrar Muestra</button>
    </form>
  </div>

  <!-- LISTA DE MUESTRAS -->
  <h2>Lista General de Muestras</h2>
  <div id="lista-muestras">
    <div class="loading">Cargando muestras desde Google Sheets...</div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxDgYMI6goFn0EsbJJpr5A_CuADumN2mOz3kQyiocb_MzX93v3Xcym5vx2ZLS7Ap0x9/exec";
const CLAVE_XRF = "xrf123";

let muestras = [];
let proveedoresGuardados = JSON.parse(localStorage.getItem('proveedores_xrf')) || [];
let agentesGuardados = JSON.parse(localStorage.getItem('agentes_xrf')) || [];
let tiposGuardados = JSON.parse(localStorage.getItem('tipos_xrf')) || [];

let rolActual = 'compras';
let autenticadoXRF = false;

document.getElementById('fecha-recolectada').value = new Date().toISOString().split('T')[0];
document.getElementById('fecha-ingreso').value = new Date().toISOString().split('T')[0];

actualizarListasMemoria();
cargarMuestrasDesdeNube();

function solicitarAccesoXRF() {
  if (autenticadoXRF) {
    cambiarRol('xrf');
    return;
  }
  const password = prompt("Ingrese la contraseña de acceso para la Vista Analista XRF:");
  if (password === CLAVE_XRF) {
    autenticadoXRF = true;
    cambiarRol('xrf');
  } else if (password !== null) {
    alert("Contraseña incorrecta. Acceso denegado.");
  }
}

function cargarMuestrasDesdeNube() {
  const contenedor = document.getElementById('lista-muestras');
  contenedor.innerHTML = '<div class="loading">Sincronizando con Google Sheets...</div>';

  fetch(WEB_APP_URL)
    .then(response => response.json())
    .then(data => {
      muestras = Array.isArray(data) ? data : [];
      actualizarLista();
    })
    .catch(err => {
      console.error("Error al cargar datos:", err);
      contenedor.innerHTML = '<p style="color:red; text-align:center;">Error al conectar con la base de datos de Google Sheets. Verifica la consola o intenta de nuevo.</p>';
    });
}

function cambiarRol(rol) {
  rolActual = rol;
  document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
  if (rol === 'compras') {
    document.getElementById('btn-compras').classList.add('active');
    document.getElementById('seccion-compras').style.display = 'block';
    document.getElementById('btn-borrar-todo').style.display = 'none';
  } else {
    document.getElementById('btn-xrf').classList.add('active');
    document.getElementById('seccion-compras').style.display = 'none';
    document.getElementById('btn-borrar-todo').style.display = 'inline-block';
  }
  actualizarLista();
}

function togglePesoInicial(checkbox) {
  const inputPeso = document.getElementById('peso-inicial');
  const inputFechaIngreso = document.getElementById('fecha-ingreso');
  if (checkbox.checked) {
    inputPeso.value = '';
    inputPeso.disabled = true;
    inputFechaIngreso.value = '';
  } else {
    inputPeso.disabled = false;
    inputFechaIngreso.value = new Date().toISOString().split('T')[0];
  }
}

function formatearFechaLimpia(str) {
  if (!str || str === 'Pendiente') return 'Pendiente';
  if (typeof str === 'string' && str.includes('T')) return str.split('T')[0];
  return str;
}

function actualizarListasMemoria() {
  const datalistProv = document.getElementById('lista-proveedores');
  datalistProv.innerHTML = '';
  proveedoresGuardados.forEach(p => {
    const option = document.createElement('option');
    option.value = p;
    datalistProv.appendChild(option);
  });

  const datalistAgentes = document.getElementById('lista-agentes');
  datalistAgentes.innerHTML = '';
  agentesGuardados.forEach(a => {
    const option = document.createElement('option');
    option.value = a;
    datalistAgentes.appendChild(option);
  });

  const datalistTipos = document.getElementById('lista-tipos');
  datalistTipos.innerHTML = '';
  tiposGuardados.forEach(t => {
    const option = document.createElement('option');
    option.value = t;
    datalistTipos.appendChild(option);
  });
}

function generarCodigo(nombreAgente) {
  const partes = nombreAgente.trim().split(/\s+/);
  const iniciales = (partes[0] ? partes[0][0] : 'X') + (partes[1] ? partes[1][0] : 'X');
  const inicialesUpper = iniciales.toUpperCase();
  const filtradas = muestras.filter(m => m.codigo && m.codigo.startsWith(inicialesUpper));
  const consecutivo = String(filtradas.length + 1).padStart(3, '0');
  return `${inicialesUpper}-${consecutivo}`;
}

document.getElementById('form-compras').addEventListener('submit', function(e) {
  e.preventDefault();

  const sinPeso = document.getElementById('sin-peso').checked;
  const inputPesoValue = document.getElementById('peso-inicial').value;

  if (!sinPeso && (!inputPesoValue || isNaN(parseFloat(inputPesoValue)))) {
    alert("Por favor ingresa un peso inicial válido o marca la casilla 'No se pudo pesar'.");
    return;
  }

  const proveedor = document.getElementById('proveedor').value.trim().toUpperCase();
  const agente = document.getElementById('agente').value.trim();
  const tipo = document.getElementById('tipo').value.trim();
  const fechaRecolectada = document.getElementById('fecha-recolectada').value;
  const fechaIngresoInput = document.getElementById('fecha-ingreso').value;
  const pesoInicial = sinPeso ? 'Pendiente' : parseFloat(inputPesoValue);
  const tipoAnalisis = document.getElementById('tipo-analisis').value;
  const notasAgente = document.getElementById('notas-agente').value;
  
  const codigo = generarCodigo(agente);
  const fechaIngreso = (sinPeso || !fechaIngresoInput) ? 'Pendiente' : fechaIngresoInput;

  if (!proveedoresGuardados.includes(proveedor)) {
    proveedoresGuardados.push(proveedor);
    localStorage.setItem('proveedores_xrf', JSON.stringify(proveedoresGuardados));
  }
  if (!agentesGuardados.includes(agente)) {
    agentesGuardados.push(agente);
    localStorage.setItem('agentes_xrf', JSON.stringify(agentesGuardados));
  }
  if (!tiposGuardados.includes(tipo)) {
    tiposGuardados.push(tipo);
    localStorage.setItem('tipos_xrf', JSON.stringify(tiposGuardados));
  }
  actualizarListasMemoria();

  const nuevaMuestra = {
    codigo,
    proveedor,
    agente,
    tipo,
    pesoInicial,
    fechaRecolectada,
    fechaIngreso,
    estatusAnalisis: 'Ingresado y en turno',
    tipoAnalisis,
    fechaAnalisis: '',
    notasAgente,
    notasXrf: '',
    pesoFinal: 'Pendiente'
  };

  guardarEnNube(nuevaMuestra, `Muestra registrada con éxito. Código
